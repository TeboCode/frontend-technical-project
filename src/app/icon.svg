<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- TeboTec mark: two diamonds, each a filled blue and an outlined green triangle.
       Shapes are bold so they stay legible at 16px. This file is the source for
       favicon.ico and apple-icon.png: run `npm run icons` after editing. -->
  <rect width="32" height="32" rx="7" fill="#fff"/>
  <g fill-rule="evenodd">
    <!-- Left diamond: blue up, green outlined down -->
    <path fill="#2196f3" d="M8.75 3.5 15 15H2.5Z"/>
    <path fill="#43a047" d="M2.5 17H15l-6.25 11.5ZM6.2 19.2h5.1l-2.55 4.69Z"/>
    <!-- Right diamond: green outlined up, blue down -->
    <path fill="#43a047" d="M23.25 3.5 29.5 15H17Zm0 4.61-2.55 4.69h5.1Z"/>
    <path fill="#2196f3" d="M17 17h12.5l-6.25 11.5Z"/>
  </g>
</svg>
